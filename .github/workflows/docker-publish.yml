name: Tests und Docker-Image

# Tests laufen bei jedem Push und Pull Request. Ein Image wird nur gebaut, wenn
# die Tests grün sind:
# - Push auf main: steht in VERSION eine Version X.Y.Z, zu der es noch keinen Tag
#   gibt, setzt dieser Workflow den Tag vX.Y.Z selbst und baut :X.Y.Z und :latest.
#   Ist der Tag schon vorhanden, wird nichts gebaut.
# - Git-Tag vX.Y.Z von Hand -> ebenfalls :X.Y.Z und :latest
# - manuell (workflow_dispatch) -> nur :dev-<kurzer Commit>, APP_VERSION=dev-<kurzer Commit>
# Die Version im Image kommt immer aus dem Tag; VERSION legt nur fest, welcher Tag entsteht.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python aufsetzen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausfuehren
        run: pytest -q

  build-and-push:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Tag setzen
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version ermitteln
        id: version
        run: |
          short=$(git rev-parse --short=7 HEAD)
          build=true
          release=false
          create_tag=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version=$(tr -d '[:space:]' < VERSION)
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
              echo "Tag v${version} existiert bereits - kein Release, kein Image."
              build=false
            else
              release=true
              create_tag=true
            fi
          else
            version="dev-${short}"
          fi
          if [[ "$release" == "true" ]] && ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '${version}' entspricht nicht X.Y.Z" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "create_tag=${create_tag}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Version: ${version} (build=${build}, release=${release}, tag setzen=${create_tag})"

      - name: Tag setzen
        if: steps.version.outputs.create_tag == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Image-Namen in Kleinbuchstaben ermitteln
        if: steps.version.outputs.build == 'true'
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Image-Tags festlegen
        if: steps.version.outputs.build == 'true'
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
            if [ "${{ steps.version.outputs.release }}" = "true" ]; then
              echo "${{ steps.image.outputs.name }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bei GitHub Container Registry anmelden
        if: steps.version.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx aufsetzen
        if: steps.version.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und pushen
        if: steps.version.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
