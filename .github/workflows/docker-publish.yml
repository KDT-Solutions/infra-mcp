name: Tests und Docker-Image

# Tests laufen bei jedem Push und Pull Request. Ein Image wird nur gebaut, wenn
# die Tests grün sind:
# - Git-Tag vX.Y.Z  -> ghcr.io/kdt-solutions/infra-mcp:X.Y.Z und :latest, APP_VERSION=X.Y.Z
# - manuell (workflow_dispatch) -> nur :dev-<kurzer Commit>, APP_VERSION=dev-<kurzer Commit>
# Pushes auf main ohne Tag bauen kein Image - :latest ändert sich nur per Tag.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python aufsetzen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausfuehren
        run: pytest -q

  build-and-push:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version ermitteln
        id: version
        run: |
          short=$(git rev-parse --short=7 HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag $GITHUB_REF_NAME entspricht nicht vX.Y.Z" >&2
              exit 1
            fi
            release=true
          else
            version="dev-${short}"
            release=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Image-Namen in Kleinbuchstaben ermitteln
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Image-Tags festlegen
        id: tags
        run: |
          {
            echo "list<<EOF"
            echo "${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
            if [ "${{ steps.version.outputs.release }}" = "true" ]; then
              echo "${{ steps.image.outputs.name }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx aufsetzen
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
