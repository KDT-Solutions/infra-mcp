services:
  infra-mcp:
    # Fertiges Image aus der GitHub Container Registry - wird per GitHub Actions
    # bei jedem Git-Tag vX.Y.Z gebaut (.github/workflows/docker-publish.yml).
    # Statt :latest kann eine feste Version (z.B. :0.1.0) eingetragen werden.
    # Ist das Package auf ghcr.io privat, braucht Portainer unter "Registries"
    # einen ghcr.io-Eintrag mit einem GitHub-Token (Scope "read:packages").
    image: ghcr.io/kdt-solutions/infra-mcp:latest
    # Bei jedem Deploy/Redeploy das Image neu ziehen statt einer evtl.
    # veralteten lokalen :latest-Kopie.
    pull_policy: always
    container_name: infra-mcp
    restart: unless-stopped
    environment:
      - PORTAINER_URL=${PORTAINER_URL}
      - PORTAINER_API_KEY=${PORTAINER_API_KEY}
      - PORTAINER_TLS_VERIFY=${PORTAINER_TLS_VERIFY:-1}
      - NPM_URL=${NPM_URL}
      - NPM_USER=${NPM_USER}
      - NPM_PASSWORD=${NPM_PASSWORD}
      - NPM_DEFAULT_EMAIL=${NPM_DEFAULT_EMAIL:-}
      - NPM_DOCKER_NETWORK=${NPM_DOCKER_NETWORK}
      # LAN-IP des Docker-Hosts: NPM leitet neue Dienste auf <DOCKER_HOST_IP>:<Host-Port> weiter
      - DOCKER_HOST_IP=${DOCKER_HOST_IP:-}
      - PUBLIC_IP=${PUBLIC_IP}
      - PROTECTED_CONTAINERS=${PROTECTED_CONTAINERS:-}
      - PROTECTED_STACKS=${PROTECTED_STACKS:-}
      - PROTECTED_DOMAINS=${PROTECTED_DOMAINS}
      - GIT_ALLOWED_REPO_PREFIXES=${GIT_ALLOWED_REPO_PREFIXES:-}
      - MCP_API_KEY=${MCP_API_KEY}
      # Host-Ressourcen über den node-exporter unten (infra_host_resources/-history)
      - NODE_EXPORTER_URL=${NODE_EXPORTER_URL:-http://infra-mcp-node-exporter:9100/metrics}
      - METRICS_INTERVAL=${METRICS_INTERVAL:-60}
      - METRICS_FILE=/data/host-metrics.jsonl
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    # Kein Docker-Socket: infra-mcp spricht nur mit der Portainer- und der NPM-API.
    volumes:
      # 24-h-Verlauf von Host-CPU/RAM, übersteht Neustarts und Redeploys
      - infra-mcp-data:/data
    depends_on:
      - node-exporter
    networks:
      - npm
      - internal
    ports:
      # Auf allen Interfaces gebunden (wie die übrigen MCP-Stacks), damit NPM
      # den Dienst auch über <Host-IP>:8427 erreicht. Die Zugriffskontrolle ist
      # das zwingende MCP_API_KEY-Bearer-Token, TLS macht NPM. Alternativ
      # leitet NPM über das gemeinsame Docker-Netz direkt auf infra-mcp:8000.
      - "${MCP_BIND_ADDR:-0.0.0.0}:${MCP_HOST_PORT:-8427}:8000"

  node-exporter:
    # Liest CPU, RAM, Load und Dateisysteme des Docker-Hosts (alles read-only).
    # Kein veröffentlichter Port, nur im stack-internen Netz erreichbar -
    # weder NPM noch das Internet sehen ihn. infra-mcp selbst bekommt keine Host-Mounts.
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: infra-mcp-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"
    networks:
      - internal

volumes:
  infra-mcp-data:

networks:
  # Nur zwischen infra-mcp und node-exporter, ohne Zugang nach aussen
  internal:
    internal: true
  # Bestehendes Docker-Netz von NPM. Darüber erreicht infra-mcp die NPM-API
  # intern (NPM_URL=http://<npm-container>:81/api) - Port 81 bleibt nicht öffentlich.
  npm:
    external: true
    name: ${NPM_DOCKER_NETWORK}
